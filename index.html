<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZONA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="logo-text">ZONA</span>
    </div>

    <div class="card">
      <div class="rate-toggle">
        <button class="rate-btn active" id="btn-fixed" onclick="setRate('fixed')">Фиксированный</button>
        <button class="rate-btn" id="btn-floating" onclick="setRate('floating')">Плавающий</button>
      </div>

      <div class="field">
        <label>Отдаю</label>
        <div class="input-row">
          <input type="number" id="from-amount" placeholder="0.0" oninput="calcRate()">
          <select id="from-currency" onchange="calcRate()">
            <option value="BTCLN">BTC</option>
            <option value="USDTERC20">USDT</option>
            <option value="ETH">ETH</option>
          </select>
        </div>
      </div>

      <div class="arrow">⇅</div>

      <div class="field">
        <label>Получаю</label>
        <div class="input-row">
          <input type="number" id="to-amount" placeholder="0.0" readonly>
          <select id="to-currency" onchange="calcRate()">
            <option value="USDTERC20">USDT</option>
            <option value="BTCLN">BTC</option>
            <option value="ETH">ETH</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Адрес получателя</label>
        <input type="text" id="recipient-address" placeholder="Введите адрес кошелька">
      </div>

      <button class="exchange-btn" onclick="createOrder()">Обменять</button>

      <p id="status"></p>
    </div>

    <p class="footer">Услуги обмена предоставляет <a href="https://fixedfloat.com" target="_blank">FixedFloat</a></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
